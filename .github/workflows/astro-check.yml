name: Astro 构建校验

# 只在 astro 分支跑构建，不部署。
# 目的：在切换 master 之前先确认 Astro 能编译通过，线上站点不受影响。
on:
  push:
    branches:
      - astro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 7