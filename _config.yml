# ==========================================================
#  Hexo 主配置
#  文档: https://hexo.io/zh-cn/docs/configuration
#  主题相关配置统一放在 _config.butterfly.yml，
#  不要直接修改 node_modules/hexo-theme-butterfly 里的文件。
# ==========================================================

# ---------- 站点 ----------
title: Levmegf
subtitle: '做生活的高手'
description: '做生活的高手'
keywords:
author: Levmegf
language: zh-CN
timezone: 'Asia/Shanghai'

# ---------- URL ----------
# 绑定自定义域名后，把 url 改成 https://你的域名（保留末尾斜杠）
url: https://levmegf.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# ---------- 目录 ----------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
# admin 目录是 Decap CMS 的静态后台，必须跳过渲染原样输出
skip_render:
  - 'admin/**'

# ---------- 写作 ----------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# ---------- 首页 ----------
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ---------- 分类 & 标签 ----------
default_category: uncategorized
category_map:
tag_map:

# ---------- 元数据 ----------
meta_generator: true

# ---------- 日期 / 时间 ----------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
# 用 date 而不是 mtime：CI 里 checkout 出来的文件 mtime 是构建时间，
# 用 mtime 会导致每次部署所有文章都变成「今天更新」。
updated_option: 'date'

# ---------- 分页 ----------
per_page: 10
pagination_dir: page

# ---------- 主题 ----------
theme: butterfly

# ---------- 部署 ----------
# 使用 GitHub Actions 自动构建部署（见 .github/workflows/pages.yml），
# 所以这里不需要配置 hexo-deployer-git。
deploy:
  type: ''

# ---------- 本地搜索（配合 Butterfly 的 local_search）----------
search:
  path: search.xml
  field: post
  content: true
  format: html

# ---------- RSS ----------
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20

# ---------- 站点地图 ----------
sitemap:
  path: sitemap.xml