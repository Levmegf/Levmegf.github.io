# ==========================================================
#  Butterfly 主题配置
#  完整可选项见官方文档: https://butterfly.js.org/
#  这里只列出常用项，未写到的项会使用主题默认值。
#  改完保存并 push，CI 会自动重新构建。
# ==========================================================

# ---------- 导航栏 ----------
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart

# ---------- 站点图标 ----------
# 已从旧站迁移 source/img/favicon.png（旧站的 favicon 路径是坏的，这里一并修好）
favicon: /img/favicon.png

# ---------- 头像 ----------
# 把头像图片放到 source/img/avatar.png，然后填 /img/avatar.png
avatar:
  img:
  effect: false

# ---------- 首页顶部大图 ----------
# 把图片放到 source/img/banner.jpg，然后填 /img/banner.jpg
index_img:
archives_img:
category_img:
tag_img:

# ---------- 社交图标 ----------
social:
  fab fa-github: https://github.com/Levmegf || Github

# ---------- 文章封面 ----------
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:

# ---------- 本地搜索 ----------
# 依赖 hexo-generator-searchdb（已在 package.json 里）
local_search:
  enable: true
  preload: false
  CDN:

# ---------- 评论系统 ----------
# 默认关闭（下方 use 留空）。推荐 Giscus：基于 GitHub Discussions，零后端、免费。
# 开启三步：
#   1) 仓库开启 Discussions：Settings > General > Features > Discussions
#   2) 打开 https://giscus.app 选择你的仓库，拿到 repo_id 和 category_id
#   3) 填到下面 giscus 段，并把 comments.use 改成 Giscus
comments:
  use:
  text: true
  lazyload: false
  count: true

giscus:
  repo: Levmegf/Levmegf.github.io
  repo_id:
  category_id:
  mapping: pathname
  strict: 0
  reactions_enabled: 1
  input_position: bottom
  theme: preferred_color_scheme
  lang: zh-CN

# ---------- 页脚 ----------
footer:
  owner:
    enable: true
    since: 2022
  copyright:
    enable: true
    version: false
  custom_text:

# ---------- 访问量统计（不蒜子）----------
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# ---------- 图片懒加载 ----------
lazyload:
  enable: true
  field: site
  placeholder:
  blur: false

# ---------- 代码块 ----------
highlight_copy: true
highlight_lang: true
highlight_shrink: false

# ---------- 目录 ----------
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false

# ---------- 其他 ----------
anchor:
  button:
    enable: false

# 字数统计 / 阅读时长（需要额外安装 hexo-wordcount 并改为 true）
wordcount:
  enable: false

# ---------- 404 页面 ----------
# 图片已从旧站迁移到 source/img/
error_404:
  enable: true
  subtitle: '页面走丢了'
  background: /img/404.jpg

# ---------- 自定义注入 ----------
# 在不改动主题源码的前提下插入自定义 CSS / JS
# 自定义样式写在 source/css/custom.css 里即可，已经帮你接好
inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'
  bottom:
    # - '<script src="/js/xxx.js"></script>'