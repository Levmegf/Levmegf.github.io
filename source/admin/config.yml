# ==========================================================
#  Decap CMS 后台配置（浏览器里写文章用）
#  访问地址：https://levmegf.github.io/admin/
#
#  认证方式：Decap Turbo 托管认证（不用自建 OAuth 服务）
#  前置条件：先在 https://turbo.decapcms.org/ 建好组织 + 站点，
#            再把下面的 turbo_site_id 换成站点 Overview 页里的 Site ID。
#  Turbo 后端仍在 beta，所以 index.html 引的是 decap-cms@beta。
# ==========================================================

backend:
  name: turbo-github
  # ↓↓↓ 必填：turbo.decapcms.org → 打开站点 → Overview 页复制 Site ID
  turbo_site_id: 0e6b98dc-319d-492e-b386-c5ed8b5563b4
  # 不写则用 Turbo 站点里设置的默认分支；显式写死 master 更稳妥
  branch: master
  # 注意：Turbo 后端会忽略 repo（以 Turbo 站点里绑定的仓库为准），故此处不写

# 中文界面
locale: zh_Hans

# 让中文标题也能生成正常文件名（否则会被清空）
slug:
  encoding: unicode
  clean_accents: false

# 图片上传位置：对应 source/img/uploads/，访问路径为 /img/uploads/
media_folder: source/img/uploads
public_folder: /img/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    preview_path: '{{year}}/{{month}}/{{day}}/{{title}}/'
    sortable_fields: [date, title]
    fields:
      - { label: 标题, name: title, widget: string }
      - {
          label: 发布日期,
          name: date,
          widget: datetime,
          date_format: 'YYYY-MM-DD',
          time_format: 'HH:mm:ss',
          format: 'YYYY-MM-DD HH:mm:ss',
        }
      - { label: 标签, name: tags, widget: list, required: false, default: [] }
      - {
          label: 分类,
          name: categories,
          widget: list,
          required: false,
          default: [],
        }
      - { label: 摘要, name: description, widget: text, required: false }
      - { label: 封面图, name: cover, widget: image, required: false }
      - { label: 正文, name: body, widget: markdown }